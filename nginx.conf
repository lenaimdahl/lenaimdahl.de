server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # add_header here would drop the security headers above, so use expires.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Only real app routes get index.html; anything else is a real 404.
    # When adding a route in src/routes/paths.ts, add it here too.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
