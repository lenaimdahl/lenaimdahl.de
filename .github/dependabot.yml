version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    assignees:
      - lenaimdahl
      - ffflorian
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    cooldown:
      default-days: 5
    groups:
      tailwindcss:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
    open-pull-requests-limit: 99
    versioning-strategy: increase
  - package-ecosystem: docker
    commit-message:
      prefix: fix(deps)
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 99
    assignees:
      - lenaimdahl
      - ffflorian
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    commit-message:
      prefix: ci(deps)
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      exclude:
        - ffflorian/*
    groups:
      ffflorian:
        patterns:
          - ffflorian/actions/*
    open-pull-requests-limit: 99
    assignees:
      - lenaimdahl
      - ffflorian
